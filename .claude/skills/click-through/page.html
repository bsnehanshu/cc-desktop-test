<title>__TITLE__</title>
<style>
/*FONTS*/
/* Whiteboard click-through (built by build.mjs from a spec): one diagram that builds step by step, caption underneath, progress dots bottom right. */
:root {
  --page: #ffffff; --paper: #ffffff; --grid: #eef0f2; --ink: #1e1e1e; --muted: #868e96; --shadow: rgba(30, 30, 30, .08);
  --red: #e03131; --green: #2f9e44; --green-fill: #b2f2bb; --blue: #1971c2; --blue-fill: #a5d8ff;
  --orange: #e8590c; --orange-fill: #ffd8a8; --purple: #6741d9; --purple-fill: #d0bfff; --yellow: #f08c00; --yellow-fill: #fff3bf;
  --gray: #495057; --gray-fill: #e9ecef;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #121417; --paper: #181a1e; --grid: #22262b; --ink: #e9ecef; --muted: #8d96a0; --shadow: rgba(0, 0, 0, .35);
    --red: #ff8787; --green: #69db7c; --green-fill: #1c3a24; --blue: #74c0fc; --blue-fill: #16324c;
    --orange: #ffa94d; --orange-fill: #45291a; --purple: #b197fc; --purple-fill: #2e2650; --yellow: #ffd43b; --yellow-fill: #3b3214; --gray: #ced4da; --gray-fill: #2a2e33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #121417; --paper: #181a1e; --grid: #22262b; --ink: #e9ecef; --muted: #8d96a0; --shadow: rgba(0, 0, 0, .35);
  --red: #ff8787; --green: #69db7c; --green-fill: #1c3a24; --blue: #74c0fc; --blue-fill: #16324c;
  --orange: #ffa94d; --orange-fill: #45291a; --purple: #b197fc; --purple-fill: #2e2650; --yellow: #ffd43b; --yellow-fill: #3b3214; --gray: #ced4da; --gray-fill: #2a2e33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background-color: var(--page); color: var(--ink);
  font-family: Excalifont, "Comic Sans MS", system-ui, sans-serif;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-inline: 16px; padding-block: 16px 56px; overflow: hidden; cursor: pointer; user-select: none;
}
.board {
  position: relative; width: min(100%, calc((100dvh - 190px) * 1620 / 940)); max-width: 100%; aspect-ratio: 1620 / 940;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 6px 6px 0 var(--shadow);
  overflow: hidden;
}
.layer { position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; }
.layer.on { opacity: 1; }
.layer svg { width: 100%; height: 100%; display: block; }
.layer text { font-family: Excalifont, "Comic Sans MS", system-ui, sans-serif; white-space: pre; }
.s-ink { stroke: var(--ink); } .s-muted { stroke: var(--muted); } .s-red { stroke: var(--red); } .s-green { stroke: var(--green); } .s-blue { stroke: var(--blue); }
.s-orange { stroke: var(--orange); } .s-purple { stroke: var(--purple); } .s-yellow { stroke: var(--yellow); } .s-gray { stroke: var(--gray); }
.f-green-fill { fill: var(--green-fill); } .f-blue-fill { fill: var(--blue-fill); } .f-orange-fill { fill: var(--orange-fill); }
.f-purple-fill { fill: var(--purple-fill); } .f-yellow-fill { fill: var(--yellow-fill); } .f-gray-fill { fill: var(--gray-fill); }
.t-ink { fill: var(--ink); } .t-muted { fill: var(--muted); } .t-red { fill: var(--red); } .t-green { fill: var(--green); } .t-blue { fill: var(--blue); }
.t-orange { fill: var(--orange); } .t-purple { fill: var(--purple); } .t-yellow { fill: var(--yellow); } .t-gray { fill: var(--gray); }
.caption {
  width: min(100%, 1100px); min-height: 80px; margin: 18px 0 0; text-align: center;
  font-size: clamp(17px, 2.1vw, 25px); line-height: 1.35; text-wrap: balance; transition: opacity .3s ease;
}
.caption.fade { opacity: 0; }
.hud {
  position: fixed; right: 22px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 14px; align-items: center;
  font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.dots { display: flex; gap: 7px; }
.dots i { width: 11px; height: 11px; border: 1.5px solid var(--muted); border-radius: 50%; }
.dots i.done { background: var(--ink); border-color: var(--ink); }
.hint { position: fixed; left: 22px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 15px; color: var(--muted); }
@media (max-width: 760px) { .hint { display: none; } .board { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .layer, .caption { transition: none; } }
</style>
<div class="board" id="board" role="img" aria-label="__LABEL__">
<!--LAYERS-->
</div>
<p class="caption" id="caption" aria-live="polite"></p>
<div class="hud"><div class="dots" id="dots"></div><span id="count"></span></div>
<div class="hint">click or &rarr; next &middot; &larr; back &middot; F full screen</div>
<script>
const STEPS = /*STEPS*/[];
const layers = [...document.querySelectorAll(".layer")];
const cap = document.getElementById("caption"), dots = document.getElementById("dots"), count = document.getElementById("count");
STEPS.forEach(() => dots.appendChild(document.createElement("i")));
let cur = 0;
function go(n) {
  n = Math.max(1, Math.min(STEPS.length, n));
  if (n === cur) return;
  cur = n;
  layers.forEach((l, i) => l.classList.toggle("on", i < n));
  [...dots.children].forEach((d, i) => d.classList.toggle("done", i < n));
  count.textContent = `${n} / ${STEPS.length}`;
  cap.classList.add("fade");
  setTimeout(() => { cap.textContent = STEPS[n - 1]; cap.classList.remove("fade"); }, 180);
  try { history.replaceState(null, "", `#${n}`); } catch (e) {}
}
function fullscreen() {
  try {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
addEventListener("keydown", (e) => {
  if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(1);
  else if (e.key === "End") go(STEPS.length);
  else if (e.key.toLowerCase() === "f") fullscreen();
});
addEventListener("click", (e) => go(e.clientX < innerWidth * 0.25 ? cur - 1 : cur + 1));
addEventListener("hashchange", () => go(parseInt(location.hash.slice(1), 10) || 1));
go(parseInt(location.hash.slice(1), 10) || 1);
</script>
